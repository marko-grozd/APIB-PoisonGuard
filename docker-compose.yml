name: poison-guard

x-data: &data-vol ./data_out:/data:z
x-models: &model-vol models:/models:z

services:
  gate:
    build:
      context: .
      dockerfile: detection_gate/Dockerfile
    environment:
      TRAINING_URL: http://training:8000/retrain
    volumes:
      - *data-vol
      - *model-vol
    ports:
      - "8001:8000"
    depends_on:
      - training

  training:
    build:
      context: .
      dockerfile: training_service/Dockerfile
    volumes:
      - *data-vol
      - *model-vol
    ports:
      - "8002:8000"

  serving:
    build:
      context: .
      dockerfile: serving_api/Dockerfile
    volumes:
      - *data-vol
      - *model-vol
    ports:
      - "8003:8000"
    depends_on:
      - training

  simulator:
    build:
      context: .
      dockerfile: attack_simulator/Dockerfile
    environment:
      GATE_URL: http://gate:8000/inspect
      ATTACK_MODE: ${ATTACK_MODE:-clean}   # clean | label_flip | chaff | ood
      BATCH_SIZE: ${BATCH_SIZE:-300}
      INTERVAL: ${INTERVAL:-5}
      POISON_FRAC: ${POISON_FRAC:-0.2}
    volumes:
      - *data-vol
    depends_on:
      - gate

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  models:
